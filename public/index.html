<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LogiFlow WMS + TMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Login -->
  <section id="auth-view" class="auth" hidden>
    <form id="auth-form" class="auth-card">
      <div class="brand big"><span class="logo">LF</span><div><b>LogiFlow</b><small>WMS + TMS</small></div></div>
      <div class="tabs" id="auth-tabs">
        <button type="button" class="tab active" data-mode="login">เข้าสู่ระบบ</button>
        <button type="button" class="tab" data-mode="signup">สมัครใช้งาน</button>
      </div>
      <label>อีเมล<input name="email" type="email" required autocomplete="username"></label>
      <label>รหัสผ่าน<input name="password" type="password" required minlength="6" autocomplete="current-password"></label>
      <button class="btn primary block" id="auth-submit">เข้าสู่ระบบ</button>
      <p class="muted small" id="auth-msg"></p>
    </form>
  </section>

  <!-- Waiting for admin approval -->
  <section id="pending-view" class="auth" hidden>
    <div class="auth-card">
      <div class="brand big"><span class="logo">LF</span><div><b>LogiFlow</b><small>WMS + TMS</small></div></div>
      <h2>รอผู้ดูแลระบบอนุมัติ</h2>
      <p class="muted">บัญชี <b id="pending-email"></b> สมัครเรียบร้อยแล้ว กรุณาแจ้งผู้ดูแลระบบให้กำหนดสิทธิ์การใช้งาน แล้วกดตรวจสอบอีกครั้ง</p>
      <button class="btn primary block" id="pending-retry">ตรวจสอบอีกครั้ง</button>
      <button class="btn ghost block" id="pending-logout">ออกจากระบบ</button>
    </div>
  </section>

  <!-- App -->
  <div id="app-view" class="layout" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="logo">LF</span><div><b>LogiFlow</b><small>WMS + TMS</small></div></div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <span class="muted small" id="user-email"></span>
        <span class="badge b-pri" id="user-role"></span>
        <button class="btn ghost sm" id="logout">ออกจากระบบ</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="btn ghost sm menu-btn" id="menu-btn" aria-label="เมนู">☰</button>
        <h1 id="page-title">-</h1>
        <div class="topbar-actions" id="page-actions"></div>
        <button class="btn ghost bell" id="bell" title="การแจ้งเตือน" hidden>🔔<span class="bell-count" id="bell-count" hidden></span></button>
        <span class="live-dot" id="live-dot" title="Realtime"></span>
      </header>
      <div id="page" class="page"></div>
    </main>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modal-form">
      <header><h2 id="modal-title"></h2><button value="cancel" class="btn ghost sm" formnovalidate aria-label="ปิด">✕</button></header>
      <div id="modal-body" class="modal-body"></div>
      <footer id="modal-foot"></footer>
    </form>
  </dialog>
  <dialog id="scan-dialog" class="scan">
    <form id="scan-form">
      <header><h2 id="scan-title">สแกนบาร์โค้ด</h2><button type="button" class="btn ghost sm" onclick="this.closest('dialog').close()" aria-label="ปิด">✕</button></header>
      <div class="modal-body">
        <div id="scan-reader"></div>
        <p class="small muted" id="scan-msg"></p>
        <div class="row" style="flex-wrap:nowrap"><input id="scan-manual" placeholder="พิมพ์ / ยิงบาร์โค้ด แล้วกด Enter" autocomplete="off"><button class="btn primary">ตกลง</button></div>
      </div>
    </form>
  </dialog>
  <div id="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/wms.js"></script>
  <script src="js/tms.js"></script>
  <script src="js/features.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
